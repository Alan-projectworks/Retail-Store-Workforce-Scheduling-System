<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login | Supermarket</title>
    <link rel="stylesheet" href="mlogin.css">
</head>
<body>

<div class="login-container">

    <div class="logo">🛒</div>

    <h1>SUPERMARKET</h1>
    <p class="subtitle">Manager Portal</p>

    <h2>Manager Login</h2>

    <form id="form">

        <label>Manager login ID</label>
        <input type="text" id="employeeId"
               placeholder="Enter Manager ID" required>

        <label>Password</label>
        <input type="password" id="password"
               placeholder="Enter Password" required>

        <button class="btn1" type="button" onclick="window.location.href='mdashboard.html'">
    LOGIN
</button>

    </form>

    <p id="message"></p>
</div>

</body>
</html>
